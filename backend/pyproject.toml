[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpn-mvp-backend"
version = "0.1.0"
description = "Backend scaffold for the VPN MVP"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]
